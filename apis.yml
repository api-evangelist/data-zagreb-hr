aid: data-zagreb-hr
name: data.zagreb.hr Official Open Data Portal
description: >-
  data.zagreb.hr Official Open Data Portal is a open data portal open-data portal for Croatia running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 199 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
