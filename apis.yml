    name: data.zagreb.hr Official Open Data Portal CKAN Action API
    description: >-
      CKAN Action API for data.zagreb.hr Official Open Data Portal, a consistent JSON-over-HTTP interface over a catalog of 199 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://data.zagreb.hr/api/3/action/.
